name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 26]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Validate all example documents
        run: |
          for file in examples/*.json; do
            npm run diagrams -- validate "$file"
          done
